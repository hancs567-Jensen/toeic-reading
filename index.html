/* ============ RENDER ============ */
const TESTS = { test1:{P5:T1P5,P6:T1P6,P7:T1P7}, test2:{P5:T2P5,P6:T2P6,P7:T2P7} };
const state = {
  test1:{p5:{},p6:{},p7:{}},
  test2:{p5:{},p6:{},p7:{}}
};
let currentTest = 'test1';
let currentPart = 'p5';

function highlight(text){
  let html = text.replace(/&/g,"&amp;").replace(/</g,"&lt;");
  const words = Object.keys(VOCAB).sort((a,b)=>b.length-a.length);
  words.forEach(w=>{
    const disp = w.replace(/[-\s]/g,m=>"\\"+m);
    const re = new RegExp("\\b("+disp+")\\b","gi");
    html = html.replace(re, (m)=>`<span class="vocab" onclick="openVocab('${w.replace(/'/g,"\\'")}')">${m}</span>`);
  });
  return html.replace(/\n/g,"<br>");
}

function openVocab(key){
  const v = VOCAB[key];
  if(!v) return;
  const wordText = key.replace(/-/g,' ');
  document.getElementById('vocabContent').innerHTML = `
    <h3>${wordText}</h3>
    <div class="pos">${v.pos}</div>
    <div class="speak-label">單字發音</div>
    <div class="speak-row">
      <button class="speak-btn" onclick="speakText('${wordText.replace(/'/g,"\\'")}','slow',this)">🐢 慢速清晰</button>
      <button class="speak-btn" onclick="speakText('${wordText.replace(/'/g,"\\'")}','normal',this)">🐇 正常連音</button>
    </div>
    <div class="zh">${v.zh}</div>
    <div class="ex-en">"${v.ex}"</div>
    <div class="ex-zh">${v.exZh}</div>
    <div class="speak-label">例句發音</div>
    <div class="speak-row">
      <button class="speak-btn" onclick="speakText('${v.ex.replace(/'/g,"\\'")}','slow',this)">🐢 慢速清晰</button>
      <button class="speak-btn" onclick="speakText('${v.ex.replace(/'/g,"\\'")}','normal',this)">🐇 正常連音</button>
    </div>`;
  document.getElementById('vocabPanel').classList.add('open');
  document.getElementById('vocabOverlay').classList.add('open');
}
function closeVocab(){
  document.getElementById('vocabPanel').classList.remove('open');
  document.getElementById('vocabOverlay').classList.remove('open');
}
document.getElementById('vocabOverlay').addEventListener('click', closeVocab);

function choose(part, qid, idx, correctIdx, btnGroupId){
  const st = state[currentTest][part];
  if(st[qid] !== undefined) return;
  st[qid] = idx;
  const group = document.getElementById(btnGroupId);
  [...group.children].forEach((btn,i)=>{
    btn.disabled = true;
    if(i===correctIdx) btn.classList.add('correct');
    else if(i===idx) btn.classList.add('wrong');
  });
  const exp = group.parentElement.querySelector('.explain');
  if(exp) exp.style.display='block';
  updateScore(part);
}

function updateScore(part){
  const el = document.getElementById('score-'+part);
  if(!el) return;
  let total=0, correct=0;
  const data = TESTS[currentTest];
  const st = state[currentTest][part];
  if(part==='p5'){
    data.P5.forEach(q=>{ total++; if(st[q.n]===q.a) correct++; });
  } else if(part==='p6'){
    data.P6.forEach(t=>t.blanks.forEach(b=>{ total++; if(st[b.n]===b.a) correct++; }));
  } else if(part==='p7'){
    data.P7.forEach(t=>t.qs.forEach(q=>{ total++; if(st[q.n]===q.a) correct++; }));
  }
  el.textContent = `已答對 ${correct} / 已作答 ${Object.keys(st).length} / 共 ${total} 題`;
}

function renderP5(){
  const data = TESTS[currentTest].P5;
  let h = `<div class="section-title">Part 5 － 單句填空<span class="score" id="score-p5">尚未作答</span></div>
  <div class="directions">每題句子中缺少一個單字或片語，請從四個選項中選出最適合的答案。點擊選項後會立即顯示正確答案與簡要解析。</div>`;
  data.forEach(q=>{
    const gid = currentTest+'p5g'+q.n;
    const speakIdx = registerSpeak(q.s.replace('___', q.c[q.a]));
    h += `<div class="card">
      <div class="sentence"><span class="qnum">${q.n}.</span>${highlight(q.s.replace('___','_____'))}
        <button class="qspeak" onclick="speakStored(${speakIdx},'slow',this)">🐢</button><button class="qspeak" onclick="speakStored(${speakIdx},'normal',this)">🐇</button>
      </div>
      <div class="choices" id="${gid}">
        ${q.c.map((c,i)=>`<button class="choice-btn" onclick="choose('p5',${q.n},${i},${q.a},'${gid}')">(${String.fromCharCode(65+i)}) ${c}</button>`).join('')}
      </div>
      <div class="explain">💡 ${q.exp}</div>
    </div>`;
  });
  return h;
}

function renderP6(){
  const data = TESTS[currentTest].P6;
  let h = `<div class="section-title">Part 6 － 短文填空<span class="score" id="score-p6">尚未作答</span></div>
  <div class="directions">閱讀短文，文中有四處空格，請選出最適合的答案。可點選文章中橘色底線的單字查看解釋，或按下方按鈕顯示整段中文翻譯。</div>`;
  data.forEach(t=>{
    let text = t.text;
    const blankSpans = {};
    t.blanks.forEach(b=>{ blankSpans[b.n]=`<span class="blank-tag">${b.n}</span>`; });
    text = text.replace(/\{\{(\d+)\}\}/g, (m,n)=>blankSpans[n]);
    const speakText6 = t.text.replace(/\{\{\d+\}\}/g, (m,n)=>t.blanks.find(b=>('{{'+b.n+'}}')===m) ? t.blanks.find(b=>('{{'+b.n+'}}')===m).c[t.blanks.find(b=>('{{'+b.n+'}}')===m).a] : 'blank');
    const speakIdx6 = registerSpeak(speakText6);
    h += `<div class="passage-box">
      <div class="passage-title">Questions ${t.range} · ${t.title}
        <button class="passage-speak" onclick="speakStored(${speakIdx6},'slow',this)">🐢 慢速</button><button class="passage-speak" onclick="speakStored(${speakIdx6},'normal',this)">🐇 連音</button>
      </div>
      <div class="passage-text">${highlight(text)}</div>
    </div>
    <div class="toolbar">
      <button class="tbtn" onclick="toggleZh('${currentTest}p6zh${t.id}')">顯示 / 隱藏中文翻譯</button>
    </div>
    <div class="zh-block" id="${currentTest}p6zh${t.id}">${t.zh}</div>`;
    t.blanks.forEach(b=>{
      const gid = currentTest+'p6g'+b.n;
      h += `<div class="card sub-q">
        <div class="sentence"><span class="qnum">${b.n}.</span></div>
        <div class="choices" id="${gid}">
          ${b.c.map((c,i)=>`<button class="choice-btn" onclick="choose('p6',${b.n},${i},${b.a},'${gid}')">(${String.fromCharCode(65+i)}) ${c}</button>`).join('')}
        </div>
        <div class="explain">💡 ${b.exp}</div>
      </div>`;
    });
  });
  return h;
}

function renderP7(){
  const data = TESTS[currentTest].P7;
  let h = `<div class="section-title">Part 7 － 閱讀理解<span class="score" id="score-p7">尚未作答</span></div>
  <div class="directions">閱讀下列文章並回答問題。可點選文章中橘色底線的單字查看解釋，或按下方按鈕顯示整段中文翻譯。</div>`;
  data.forEach(t=>{
    const speakIdx7 = registerSpeak(t.text);
    h += `<div class="passage-box">
      <div class="passage-title">Questions ${t.qrange} · ${t.title}
        <button class="passage-speak" onclick="speakStored(${speakIdx7},'slow',this)">🐢 慢速</button><button class="passage-speak" onclick="speakStored(${speakIdx7},'normal',this)">🐇 連音</button>
      </div>
      <div class="passage-text">${highlight(t.text)}</div>
    </div>
    <div class="toolbar">
      <button class="tbtn" onclick="toggleZh('${currentTest}p7zh${t.id}')">顯示 / 隱藏中文翻譯</button>
    </div>
    <div class="zh-block" id="${currentTest}p7zh${t.id}">${t.zh}</div>`;
    t.qs.forEach(q=>{
      const gid = currentTest+'p7g'+q.n;
      h += `<div class="card sub-q">
        <div class="sentence"><span class="qnum">${q.n}.</span>${highlight(q.q)}</div>
        <div class="choices" id="${gid}">
          ${q.c.map((c,i)=>`<button class="choice-btn" onclick="choose('p7',${q.n},${i},${q.a},'${gid}')">(${String.fromCharCode(65+i)}) ${c}</button>`).join('')}
        </div>
        <div class="explain">💡 ${q.exp}</div>
      </div>`;
    });
  });
  return h;
}

function renderPatterns(){
  let h = `<div class="section-title">常用句型參考</div>
  <div class="directions">以下句型取材自 Test 1 / Test 2 文章中反覆出現、值得學起來的實用句型與搭配用法。</div>`;
  PATTERNS.forEach(p=>{
    const idx = registerSpeak(p.ex);
    h += `<div class="pattern-card">
      <div class="pattern-en">${p.en}</div>
      <div class="pattern-zh">${p.zh}</div>
      <div class="pattern-ex">${highlight(p.ex)}
        <button class="qspeak" onclick="speakStored(${idx},'slow',this)">🐢</button><button class="qspeak" onclick="speakStored(${idx},'normal',this)">🐇</button>
      </div>
      <div class="pattern-exzh">${p.exZh}</div>
    </div>`;
  });
  return h;
}

function toggleZh(id){
  const el = document.getElementById(id);
  el.style.display = (el.style.display==='block') ? 'none' : 'block';
}

const renderers = { p5:renderP5, p6:renderP6, p7:renderP7 };

function renderMain(){
  if(currentTest==='patterns'){
    document.getElementById('main').innerHTML = renderPatterns();
    document.getElementById('partTabs').style.display='none';
    return;
  }
  document.getElementById('partTabs').style.display='flex';
  document.getElementById('main').innerHTML = renderers[currentPart]();
  updateScore(currentPart);
}

document.getElementById('testTabs').addEventListener('click', e=>{
  if(e.target.tagName!=='BUTTON') return;
  currentTest = e.target.dataset.test;
  document.querySelectorAll('#testTabs button').forEach(b=>b.classList.toggle('active', b.dataset.test===currentTest));
  renderMain();
  window.scrollTo({top:0, behavior:'smooth'});
});
document.getElementById('partTabs').addEventListener('click', e=>{
  if(e.target.tagName!=='BUTTON') return;
  currentPart = e.target.dataset.part;
  document.querySelectorAll('#partTabs button').forEach(b=>b.classList.toggle('active', b.dataset.part===currentPart));
  renderMain();
  window.scrollTo({top:0, behavior:'smooth'});
});

renderMain();
</script>
</body>
</html>
